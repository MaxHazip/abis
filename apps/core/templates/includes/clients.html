<div class="carusel_clients" id="clients">
    <p class="clients_title">Наши клиенты</p>
    <div class="clients-slider">
        {% for _ in "1234" %}
        <div class="clients-slide">
            {% for item in clients_list %}
                {% if item.image %}
                    <img src="{{ item.image.url }}" alt="{{ item.name }}">
                {% endif %}
            {% endfor %}
        </div>
        {% endfor %}
    </div>
</div>
