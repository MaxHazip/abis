upstream django_app {

    server web:8000;

}

server {
    listen 80;
    server_name localhost;
    client_max_body_size 20M;

    location /static/ {

        alias /app/staticfiles/;
        expires 30d;

    }

    location /media/ {

        alias /app/media/;
        expires 30d;

    }

    location / {

        proxy_pass http://django_app;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;

    }
}